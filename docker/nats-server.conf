# Default server config baked into the image. The Dockerfile copies this to
# /pubsub/conf/server.conf and the entrypoint runs with `-c` on it.
#
# Client and monitoring only. Clustering belongs to whoever runs a cluster:
# the route port is useless without routes, and the config it used to carry
# named a fixed user and password, which is a credential published in every
# copy of the image. Mount a config with a `cluster` block to form one.

# Client connections, all interfaces.
port: 4222

# HTTP monitoring — the image healthcheck and /varz read this.
monitor_port: 8222
