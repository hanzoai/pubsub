# Canonical CI/CD config for hanzoai/pubsub — the one file both the hanzoai/ci
# reusable (.hanzo/workflows/cicd.yml) and platform.hanzo.ai read.
#
# The gate compiles and vets EVERYTHING, then runs the suites that need no
# cluster: config parsing, the internal packages, the logger, and the embedded
# server. That split is the point. ./server holds 87 test files that stand up
# real routes, JetStream stores and MQTT sessions — the repo's own workflows
# give them 60-minute timeouts, `-p 1`, and separate scheduled runs for exactly
# that reason, and they still live there. Pulling them into a per-push gate
# would trade a signal that arrives in minutes for one that times out.
#
# `go vet ./...` is unscoped on purpose: it is cheap, it reads the server tree
# too, and it is the part of the whole-repo check that does not need a cluster.

images:
  # ghcr.io/hanzoai/pubsub was built by a reusable in hanzoai/.github called from
  # .github/workflows/deploy.yml. github.com is no longer where this repo's
  # pipeline lives, so the image is declared here and built by the same lane
  # that gates it — one build, one place.
  - name: pubsub
    context: .
    dockerfile: Dockerfile
    repo: ghcr.io/hanzoai/pubsub

test:
  - name: build
    run: |
      set -e
      go build ./...
      go vet ./...
      go test -count=1 ./conf/... ./internal/... ./logger/... ./embed/...
